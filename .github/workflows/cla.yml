# Asks first-time contributors of code/docs to sign CLA.md by commenting on their PR.
# Signatures are stored in signatures/cla.json on the `cla-signatures` branch. Module-only PRs (products/**)
# are CC BY 4.0 and skip the CLA.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]
    paths-ignore:
      - 'products/**'

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      # Never checks out PR code, so pull_request_target is safe here.
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          allowlist: DamirManyapov,dependabot[bot],renovate[bot],github-actions[bot]

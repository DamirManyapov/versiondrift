# Daily feed update (docs/04-collector.md): collect every module, publish to R2 (feed.versiondrift.dev),
# keep the HTTP cache in the private state bucket, open/close issues for modules that keep failing.
name: Collect

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: Comma-separated module ids (empty = all)
        required: false
        default: ''
      force:
        description: Publish even if the guard finds the feed suspicious
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Restore HTTP cache
        run: pnpm collector state-pull

      - name: Collect
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          pnpm collect --out .feed "${args[@]}"

      - name: Publish
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: pnpm collector publish --dir .feed

      - name: Save HTTP cache
        run: pnpm collector state-push

      - name: Issues for broken modules
        if: ${{ !cancelled() && hashFiles('.feed/v1/health.json') != '' }}
        run: pnpm collector issues --dir .feed

      - name: Keep the built feed
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: feed
          path: .feed/v1
          retention-days: 14

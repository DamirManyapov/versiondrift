name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, test, modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # pnpm from package.json "packageManager", Node from .nvmrc, then `pnpm install --frozen-lockfile`.
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm -r test
      # Errors show up as annotations on the PR diff.
      - run: pnpm modules:validate

      - name: Database migrations match the schema
        run: |
          pnpm -F @versiondrift/db generate
          git diff --exit-code -- packages/db/ && test -z "$(git status --porcelain -- packages/db/drizzle)" || {
            echo "::error::packages/db schema changed without a migration: run pnpm -F @versiondrift/db generate and commit it"
            exit 1
          }

      - name: Generated schemas are up to date
        run: |
          pnpm schema:gen
          git diff --exit-code -- schemas/ || {
            echo "::error::schemas/ is out of date: run pnpm schema:gen and commit the result"
            exit 1
          }

  docker:
    name: self-hosted image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # amd64 only and not pushed: this checks the Dockerfile; release.yml builds and publishes both platforms.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: versiondrift:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container starts and answers /healthz
        run: |
          docker run -d --name vd -p 8080:8080 --read-only --tmpfs /tmp -v vd-data:/data versiondrift:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = 303  # → /login
          test "$(docker inspect -f '{{.Config.User}}' versiondrift:ci)" = node
          docker logs vd
      - name: Self-hosted mode signs in and keeps boards in SQLite under /data
        run: |
          docker run -d --name vd-sh -p 8081:8080 --read-only --tmpfs /tmp \
            -e VD_MODE=selfhosted -e VD_ADMIN_PASSWORD=ci-password-1 -v vd-sh:/data versiondrift:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8081/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/api/boards)" = 401
          signin() {
            curl -fsS -o /dev/null -c jar.txt -H 'origin: http://127.0.0.1:8081' -H 'accept: text/html' \
              -d 'name=admin&password=ci-password-1' http://127.0.0.1:8081/login
          }
          signin
          curl -fsS -b jar.txt -X PUT -H 'content-type: application/json' \
            -d '{"v":1,"items":[{"p":"grafana","ver":"12.4.5"}],"settings":{"criticalCvss":7,"hideOk":false}}' \
            http://127.0.0.1:8081/api/boards/1/inventory
          docker restart vd-sh
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8081/healthz && break; sleep 1; done
          curl -fsS -b jar.txt http://127.0.0.1:8081/api/boards/1/inventory | grep -q '"12.4.5"'
          docker logs vd-sh

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, test, modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # pnpm from package.json "packageManager", Node from .nvmrc, then `pnpm install --frozen-lockfile`.
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm -r test
      # Errors show up as annotations on the PR diff.
      - run: pnpm modules:validate

      # The public site's Workers build must not pick up self-hosted-only code (see vite.config.ts aliases).
      - name: Cloudflare build
        run: pnpm web:build:cf

      - name: Database migrations match the schema
        run: |
          pnpm -F @versiondrift/db generate
          git diff --exit-code -- packages/db/ && test -z "$(git status --porcelain -- packages/db/drizzle)" || {
            echo "::error::packages/db schema changed without a migration: run pnpm -F @versiondrift/db generate and commit it"
            exit 1
          }

      - name: Generated schemas are up to date
        run: |
          pnpm schema:gen
          git diff --exit-code -- schemas/ || {
            echo "::error::schemas/ is out of date: run pnpm schema:gen and commit the result"
            exit 1
          }

  e2e:
    name: end-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: pnpm web:build:node
      - run: pnpm -F @versiondrift/web exec playwright install --with-deps chromium
      # Public site and a self-hosted instance over the fixed feed in apps/web/e2e/feed.
      - run: pnpm -F @versiondrift/web e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint --strict charts/versiondrift
      - name: Renders with sign-in modes, ingress and an inventory
        run: |
          helm template vd charts/versiondrift > /dev/null
          helm template vd charts/versiondrift --set auth.mode=oidc --set auth.oidc.issuer=https://auth.example.com/ \
            --set auth.oidc.clientId=vd --set ingress.enabled=true --set-string 'inventory=boards: {}' > /dev/null
          helm template vd charts/versiondrift --set auth.mode=header --set persistence.enabled=false > /dev/null
          ! helm template vd charts/versiondrift --set auth.mode=oidc 2> /dev/null  # issuer is required

  docker:
    name: self-hosted image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # amd64 only and not pushed: this checks the Dockerfile; release.yml builds and publishes both platforms.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: versiondrift:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container starts and answers /healthz
        run: |
          docker run -d --name vd -p 8080:8080 --read-only --tmpfs /tmp -v vd-data:/data versiondrift:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = 303  # → /login
          test "$(docker inspect -f '{{.Config.User}}' versiondrift:ci)" = node
          docker logs vd
      - name: Self-hosted mode signs in and keeps boards in SQLite under /data
        run: |
          trap 'echo "--- container log"; docker logs vd-sh' ERR
          docker run -d --name vd-sh -p 8081:8080 --read-only --tmpfs /tmp \
            -e VD_MODE=selfhosted -e VD_ADMIN_PASSWORD=ci-password-1 -v vd-sh:/data versiondrift:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8081/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/api/boards)" = 401
          status=$(curl -sS -o signin.txt -w '%{http_code}' -c jar.txt -H 'origin: http://127.0.0.1:8081' \
            -H 'accept: text/html' --data-urlencode 'name=admin' --data-urlencode 'password=ci-password-1' \
            http://127.0.0.1:8081/login)
          test "$status" = 303 || { echo "sign-in answered $status"; head -c 2000 signin.txt; false; }
          curl -fsS -b jar.txt http://127.0.0.1:8081/api/boards | grep -q '"Main"'
          curl -fsS -b jar.txt -X PUT -H 'content-type: application/json' \
            -d '{"v":1,"items":[{"p":"grafana","ver":"12.4.5"}],"settings":{"criticalCvss":7,"hideOk":false}}' \
            http://127.0.0.1:8081/api/boards/1/inventory
          docker restart vd-sh
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8081/healthz && break; sleep 1; done
          curl -fsS -b jar.txt http://127.0.0.1:8081/api/boards/1/inventory | grep -q '"12.4.5"'
          # The verified feed mirror (first sync after start: the public feed, ~15 MB).
          for i in $(seq 1 90); do curl -fsS -o /dev/null http://127.0.0.1:8081/feed/v1/index.json && break; sleep 2; done
          curl -fsS -o /dev/null http://127.0.0.1:8081/feed/v1/index.json
          curl -fsS -b jar.txt -o /dev/null http://127.0.0.1:8081/p/grafana
          docker logs vd-sh | grep 'feed synced'

# yaml-language-server: $schema=../schemas/module.schema.json
# Added 2026-09-26 (S4-T5); checked against the live sources.
id: rocky-linux
name: Rocky Linux
vendor: Rocky Enterprise Software Foundation
category: os
homepage: https://rockylinux.org
logo: simpleicons:rockylinux
description: Enterprise Linux (RHEL-compatible).
versionScheme: loose
sources:
  releases: { type: endoflife, product: rocky-linux }   # latest point release per cycle; history accumulates
  eol: { type: endoflife, product: rocky-linux }
detect:
  - file: { path: /etc/rocky-release }
maintainers: ["@DamirManyapov"]

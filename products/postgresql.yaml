# yaml-language-server: $schema=../schemas/module.schema.json
# Verified against the live sources on 2026-09-26 (S1-T7).
id: postgresql
name: PostgreSQL
aliases: [postgres, pg]
vendor: PostgreSQL Global Development Group
category: database
homepage: https://www.postgresql.org
logo: simpleicons:postgresql
description: Open-source object-relational database.
versionScheme: loose             # 18.6; each major is a branch
tracks:
  - { id: "18", match: '^18\.' }
  - { id: "17", match: '^17\.' }
  - { id: "16", match: '^16\.' }
  - { id: "15", match: '^15\.' }
  - { id: "14", match: '^14\.' }
sources:
  releases:
    - type: rss                  # latest minor per supported major, dated
      url: https://www.postgresql.org/versions.rss
      versionFrom: title
    - type: html                 # every minor of the supported majors (14+) from the release notes archive, undated
      url: https://www.postgresql.org/docs/release/
      select: { item: details.release-notes-list li, body: script }
      versionRegex: '^((?:1[4-9]|[2-9]\d)\.\d+)$'
  releasesExtra:
    - type: notes                # each release's notes page; its "Release date:" dates the archive's releases
      url: https://www.postgresql.org/docs/release/{version}/
      select: '#docContent'
  security:
    - { type: nvd, cpe: "cpe:2.3:a:postgresql:postgresql" }
  eol: { type: endoflife, product: postgresql }
detect:
  - sql: { engine: postgresql, query: "SHOW server_version", regex: '^(\d+\.\d+)' }
  - docker: { image: postgres }
maintainers: ["@DamirManyapov"]

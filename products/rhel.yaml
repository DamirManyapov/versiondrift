# yaml-language-server: $schema=../schemas/module.schema.json
# Added 2026-09-26 (S4-T5); checked against the live sources.
id: rhel
name: Red Hat Enterprise Linux
vendor: Red Hat
category: os
homepage: https://www.redhat.com/en/technologies/linux-platforms/enterprise-linux
logo: simpleicons:redhat
description: Enterprise Linux distribution.
versionScheme: loose
sources:
  releases: { type: endoflife, product: rhel }   # latest point release per cycle; history accumulates
  eol: { type: endoflife, product: rhel }
detect:
  - file: { path: /etc/redhat-release }
maintainers: ["@DamirManyapov"]

# yaml-language-server: $schema=../schemas/module.schema.json
# Added 2026-09-26 (S4-T5); checked against the live sources.
id: keycloak
name: Keycloak
vendor: CNCF
category: identity
homepage: https://www.keycloak.org
logo: simpleicons:keycloak
description: Identity and access management.
versionScheme: semver
tagFilter:
  include: '^\d+\.\d+\.\d+$'
sources:
  releases: { type: github, repo: keycloak/keycloak }
  security:
    - { type: ghsa, repo: keycloak/keycloak }
  eol: { type: endoflife, product: keycloak }
detect:
  - docker: { image: keycloak/keycloak }
maintainers: ["@DamirManyapov"]

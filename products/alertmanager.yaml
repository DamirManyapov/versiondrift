# yaml-language-server: $schema=../schemas/module.schema.json
# Added 2026-09-26 (S4-T5); checked against the live sources.
id: alertmanager
name: Alertmanager
vendor: CNCF
category: monitoring
homepage: https://prometheus.io/docs/alerting/latest/alertmanager/
description: Alert routing for Prometheus.
versionScheme: semver
tagFilter:
  include: '^v?\d+\.\d+\.\d+$'
sources:
  releases: { type: github, repo: prometheus/alertmanager }
  security:
    - { type: ghsa, repo: prometheus/alertmanager }
detect:
  - docker: { image: prom/alertmanager }
maintainers: ["@DamirManyapov"]

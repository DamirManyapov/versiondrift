homepage: https://helm.sh
logo: simpleicons:helm
description: Package manager for Kubernetes.
versionScheme: semver
tagFilter:
  include: '^v?\d+\.\d+\.\d+$'
sources:
  releases: { type: github, repo: helm/helm }
  security:
    - { type: ghsa, repo: helm/helm }
maintainers: ["@DamirManyapov"]

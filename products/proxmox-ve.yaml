# yaml-language-server: $schema=../schemas/module.schema.json
# Verified against the live sources on 2026-09-26 (S1-T7).
id: proxmox-ve
name: Proxmox VE
aliases: [pve, proxmox]
vendor: Proxmox Server Solutions
category: virtualization
homepage: https://www.proxmox.com/en/proxmox-virtual-environment
logo: simpleicons:proxmox
description: Virtualization platform for KVM and LXC.
versionScheme: loose
tracks:
  - { id: "9", match: '^9\.' }
  - { id: "8", match: '^8\.' }
sources:
  releases:                      # roadmap wiki: one "<h2>Proxmox VE X.Y</h2>" per release, "Released 05. August 2026" below
    type: html
    url: https://pve.proxmox.com/wiki/Roadmap
    select: { item: h2 }
    versionRegex: '^Proxmox VE (\d+\.\d+(?:\.\d+)?)$'
    dateFormat: 'DD. MMM YYYY'
  security:
    - { type: nvd, cpe: "cpe:2.3:a:proxmox:virtual_environment" }
  eol: { type: endoflife, product: proxmox-ve }
detect:
  - command: { run: pveversion, regex: 'pve-manager/(\S+)/' }
  - http: { path: /api2/json/version, jsonPath: $.data.version, defaultPort: 8006, scheme: https }
maintainers: ["@DamirManyapov"]

# yaml-language-server: $schema=../schemas/module.schema.json
# Verified against the live sources on 2026-09-26 (S1-T7).
id: zabbix
name: Zabbix
vendor: Zabbix SIA
category: monitoring
homepage: https://www.zabbix.com
logo: simpleicons:zabbix
description: Enterprise monitoring for networks, servers and applications.
versionScheme: semver
tagFilter:
  include: '^\d+\.\d+\.\d+$'
tracks:
  - { id: "7.4", match: '^7\.4\.' }
  - { id: "7.0", match: '^7\.0\.', label: LTS }
  - { id: "6.0", match: '^6\.0\.', label: LTS }
releaseNotesUrl: https://www.zabbix.com/rn/rn{version}
sources:
  releases: { type: github, repo: zabbix/zabbix, useTags: true }   # a mirror: tags only, notes on zabbix.com
  security:
    - { type: nvd, cpe: "cpe:2.3:a:zabbix:zabbix" }
  eol: { type: endoflife, product: zabbix }
detect:
  - command: { run: "zabbix_server -V", regex: 'v(\d+\.\d+\.\d+)' }
maintainers: ["@DamirManyapov"]

# yaml-language-server: $schema=../schemas/module.schema.json
# Verified against the live sources on 2026-09-26 (S1-T7).
id: percona-xtradb-cluster
name: Percona XtraDB Cluster
aliases: [pxc, percona-cluster]
vendor: Percona
category: database
homepage: https://www.percona.com/mysql/software/percona-xtradb-cluster
description: MySQL-compatible synchronous multi-master cluster (Galera).
versionScheme: loose             # 8.0.36-28.1 = MySQL 8.0.36, Percona build 28, PXC build 1
tracks:
  - { id: "9", match: '^9\.', label: Innovation }
  - { id: "8.4", match: '^8\.4\.', label: LTS }
  - { id: "8.0", match: '^8\.0\.' }
  - { id: "5.7", match: '^5\.7\.' }
sources:
  releases:
    type: github
    repo: percona/percona-xtradb-cluster
    useTags: true
    versionRegex: '^Percona-XtraDB-Cluster-(\d+\.\d+\.\d+-\d+(?:\.\d+)?)$'
  security:
    - { type: nvd, cpe: "cpe:2.3:a:percona:xtradb_cluster" }
  # endoflife.date has no Percona XtraDB Cluster page (2026-09)
detect:
  - sql: { engine: mysql, query: "SELECT VERSION()" }
maintainers: ["@DamirManyapov"]

# yaml-language-server: $schema=../schemas/module.schema.json
# DRAFT — repo names, URLs, selectors and CPEs are unverified; verify in S1-T7.
id: percona-xtradb-cluster
name: Percona XtraDB Cluster
aliases: [pxc, percona-cluster]
vendor: Percona
category: database
homepage: https://www.percona.com/mysql/software/percona-xtradb-cluster
description: MySQL-compatible synchronous multi-master cluster (Galera).
versionScheme: loose            # e.g. 8.0.36-28, 5.7.44-31.65
tagFilter:
  include: '^Percona-XtraDB-Cluster-\d'
tracks:
  - { id: "8.4", match: '^8\.4\.' }
  - { id: "8.0", match: '^8\.0\.' }
  - { id: "5.7", match: '^5\.7\.' }
sources:
  releases: { type: github, repo: percona/percona-xtradb-cluster, useTags: true }
  releasesExtra:
    - type: html
      url: https://docs.percona.com/percona-xtradb-cluster/8.4/release-notes/release-notes_index.html
      select: { item: "article li a" }
  security:
    - { type: nvd, cpe: "cpe:2.3:a:percona:xtradb_cluster" }
  eol: { type: endoflife, product: percona-xtradb-cluster }
detect:
  - sql: { engine: mysql, query: "SELECT VERSION()" }
maintainers: []

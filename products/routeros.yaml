# yaml-language-server: $schema=../schemas/module.schema.json
# Verified against the live sources on 2026-09-26 (S1-T7); update channels added the same day.
id: routeros
name: MikroTik RouterOS
aliases: [mikrotik]
vendor: MikroTik
category: network
homepage: https://mikrotik.com/software
logo: simpleicons:mikrotik
description: Operating system of MikroTik routers and switches.
versionScheme: loose
tagFilter:
  exclude: 'beta'                # the development channel (7.25beta5) is not shown
prerelease: include              # release candidates count only in the testing channel
releaseNotesUrl: https://upgrade.mikrotik.com/routeros/{version}/CHANGELOG
# MikroTik's update channels (System → Packages → Check For Updates), per RouterOS line: users pick the line, then the
# channel. "long-term" is whatever branch the update server names today (7.23 and 6.49 as of 2026-09); a version of
# that branch is assumed to be on it unless the user picks "stable". Channels overlap: 7.23.7 is in long-term and in
# stable. The development channel (betas) is left out.
defaultTrack: 7-stable
tracks:
  - id: 7-long-term
    group: RouterOS 7
    label: long-term
    current: { url: https://upgrade.mikrotik.com/routeros/NEWESTa7.long-term }
  - { id: 7-stable, group: RouterOS 7, label: stable, match: '^7\.' }
  - { id: 7-testing, group: RouterOS 7, label: testing, match: '^7\.', prereleases: true }
  - id: 6-long-term
    group: RouterOS 6
    label: long-term
    current: { url: https://upgrade.mikrotik.com/routeros/NEWEST6.long-term }
  - { id: 6-stable, group: RouterOS 6, label: stable, match: '^6\.' }
sources:
  releases:
    - type: rss                  # the current stable release, with notes
      url: https://mikrotik.com/current.rss
      versionFrom: title
      versionRegex: 'RouterOS (\d+\.\d+(?:\.\d+)?) \[stable\]'
    - type: html                 # the long-term channel's history (versions and dates; notes load on demand)
      url: https://mikrotik.com/download/changelogs
      select: { item: div.changelog, title: span.mtk-text-sm, body: pre, date: span.mtk-text-xs }
    - { type: pointer, url: https://upgrade.mikrotik.com/routeros/NEWESTa7.stable, epoch: true }
    - { type: pointer, url: https://upgrade.mikrotik.com/routeros/NEWESTa7.long-term, epoch: true }
    - { type: pointer, url: https://upgrade.mikrotik.com/routeros/NEWESTa7.testing, epoch: true }
    - { type: pointer, url: https://upgrade.mikrotik.com/routeros/NEWEST6.long-term, epoch: true }
    - { type: pointer, url: https://upgrade.mikrotik.com/routeros/NEWEST6.stable, epoch: true }
    - { type: endoflife, product: routeros }   # the latest release of every branch
  releasesExtra:
    - { type: notes, url: "https://upgrade.mikrotik.com/routeros/{version}/CHANGELOG" }
  security:
    - { type: nvd, cpe: "cpe:2.3:o:mikrotik:routeros" }
  eol: { type: endoflife, product: routeros }
detect:
  - snmp: { oid: "1.3.6.1.4.1.14988.1.1.4.4.0" }
maintainers: ["@DamirManyapov"]

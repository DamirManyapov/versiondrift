# yaml-language-server: $schema=../schemas/module.schema.json
# Added 2026-09-26 (S4-T5); checked against the live sources.
id: haproxy
name: HAProxy
vendor: HAProxy Technologies
category: network
homepage: https://www.haproxy.org
logo: simpleicons:haproxy
description: Load balancer and proxy.
versionScheme: semver
sources:
  releases: { type: endoflife, product: haproxy }   # the GitHub mirror only carries the development branch
  security:
    - { type: nvd, cpe: "cpe:2.3:a:haproxy:haproxy" }
  eol: { type: endoflife, product: haproxy }
detect:
  - docker: { image: haproxy }
maintainers: ["@DamirManyapov"]

# yaml-language-server: $schema=../schemas/module.schema.json
# Added 2026-09-26 (S4-T5); checked against the live sources.
id: victoriametrics
name: VictoriaMetrics
vendor: VictoriaMetrics
category: monitoring
homepage: https://victoriametrics.com
description: Time series database and monitoring.
versionScheme: semver
tagFilter:
  include: '^v?\d+\.\d+\.\d+$'
sources:
  releases: { type: github, repo: VictoriaMetrics/VictoriaMetrics }
  security:
    - { type: ghsa, repo: VictoriaMetrics/VictoriaMetrics }
detect:
  - docker: { image: victoriametrics/victoria-metrics }
maintainers: ["@DamirManyapov"]

id: ubuntu
name: Ubuntu
vendor: Canonical
category: os
homepage: https://ubuntu.com
logo: simpleicons:ubuntu
description: Linux distribution.
versionScheme: loose
sources:
  releases: { type: endoflife, product: ubuntu }   # latest point release per cycle; history accumulates
  eol: { type: endoflife, product: ubuntu }
detect:
  - file: { path: /etc/os-release }
maintainers: ["@DamirManyapov"]

# VersionDrift, self-hosted (docs/07): `docker compose up -d`, then open http://localhost:8080 and sign in as admin
# (the password is VD_ADMIN_PASSWORD, or the one printed once in `docker compose logs versiondrift`).
# Pin a release (`:0.1.0`) instead of `latest` to update on your own schedule; `build: .` builds from a clone instead.
services:
  versiondrift:
    image: ghcr.io/damirmanyapov/versiondrift:latest
    # build: .
    ports: ['8080:8080']
    volumes: ['vd-data:/data']
    environment:
      VD_AUTH: password # none (trusted LAN only) | password | oidc | header
      VD_ADMIN_PASSWORD: ${VD_ADMIN_PASSWORD:-} # first start only, 8+ characters; empty = generated and logged
      VD_TZ: ${VD_TZ:-UTC}
      # VD_FEED_URL: 'off' # no Internet access: update the feed with offline packages (Settings → Feed)
      # VD_DEMO: '1' # try the fleet screens on the demo data (31 hosts)
    restart: unless-stopped

volumes:
  vd-data: # the database, the secret key (back it up) and the feed copy

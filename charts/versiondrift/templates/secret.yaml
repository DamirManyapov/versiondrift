{{- if not .Values.existingSecret }}
{{- $values := dict "admin-password" .Values.auth.adminPassword "secret-key" .Values.secretKey "oidc-client-secret" .Values.auth.oidc.clientSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "versiondrift.fullname" . }}
  labels: {{- include "versiondrift.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := $values }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
